PKG_NAME="gcc"
PKG_VER="16.2.0"
PKG_URL1="https://ftp.gnu.org/gnu/gcc/gcc-${PKG_VER}/gcc-${PKG_VER}.tar.xz"
PKG_URL2=""
PKG_URL3=""
PKG_BUILD_TYPE="custom"
PKG_PRE_BUILD="case $(uname -m) in x86_64) sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64 ;; esac && mkdir -p build && useradd -m tester 2>/dev/null || true"
PKG_CUSTOM_BUILD="cd build && ../configure --prefix=/usr LD=ld --enable-languages=c,c++ --enable-default-pie --enable-default-ssp --enable-host-pie --disable-multilib --disable-bootstrap --disable-fixincludes --with-system-zlib && make -j$(nproc)"
PKG_CUSTOM_INSTALL="cd build && ulimit -s -H unlimited && sed -e '/cpython/d' -i ../gcc/testsuite/gcc.dg/plugin/plugin.exp && chown -R tester . && su tester -c 'PATH=$PATH make -k check -j$(nproc)' ; ../contrib/test_summary | grep -A7 Summ && make install && chown -v -R root:root /usr/lib/gcc/\$(gcc -dumpmachine)/${PKG_VER}/include{,-fixed} && ln -svr /usr/bin/cpp /usr/lib && ln -sv gcc.1 /usr/share/man/man1/cc.1 && ln -sfv ../../libexec/gcc/\$(gcc -dumpmachine)/${PKG_VER}/liblto_plugin.so /usr/lib/bfd-plugins/ && mkdir -pv /usr/share/gdb/auto-load/usr/lib && mv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib"
