PKG_NAME="tcl"
PKG_VER="9.0.1"
PKG_URL1="https://downloads.sourceforge.net/tcl/tcl${PKG_VER}-src.tar.gz"
PKG_TARBALL="tcl${PKG_VER}-src.tar.gz"
PKG_BUILD_TYPE="custom"
PKG_CUSTOM_BUILD="SRCDIR=$(pwd) && cd unix && ./configure --prefix=/usr --mandir=/usr/share/man --disable-rpath && make && sed -e \"s|\$SRCDIR/unix|/usr/lib|\" -e \"s|\$SRCDIR|/usr/include|\" -i tclConfig.sh && sed -e \"s|\$SRCDIR/unix/pkgs/tdbc1.1.10|/usr/lib/tdbc1.1.10|\" -e \"s|\$SRCDIR/pkgs/tdbc1.1.10/generic|/usr/include|\" -e \"s|\$SRCDIR/pkgs/tdbc1.1.10/library|/usr/lib/tcl9.0|\" -e \"s|\$SRCDIR/pkgs/tdbc1.1.10|/usr/include|\" -i pkgs/tdbc1.1.10/tdbcConfig.sh && sed -e \"s|\$SRCDIR/unix/pkgs/itcl4.3.2|/usr/lib/itcl4.3.2|\" -e \"s|\$SRCDIR/pkgs/itcl4.3.2/generic|/usr/include|\" -e \"s|\$SRCDIR/pkgs/itcl4.3.2|/usr/include|\" -i pkgs/itcl4.3.2/itclConfig.sh"
PKG_CUSTOM_INSTALL="cd unix && make install && chmod 644 /usr/lib/libtclstub9.0.a && chmod -v u+w /usr/lib/libtcl9.0.so && make install-private-headers && ln -sfv tclsh9.0 /usr/bin/tclsh && mv -v /usr/share/man/man3/{Thread,Tcl_Thread}.3"
