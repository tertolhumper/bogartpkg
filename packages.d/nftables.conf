PKG_NAME="nftables"
PKG_VER="1.1.7"
PKG_URL1="https://netfilter.org/projects/nftables/files/nftables-${PKG_VER}.tar.xz"
PKG_BUILD_TYPE="autotools"
PKG_OPTS="--prefix=/usr \
    --sysconfdir=/etc \
    --with-json \
    --with-python-bin=/usr/bin/python3 \
    --disable-man-doc"
PKG_POST_INSTALL="cd /var/tmp/bogartpkg/nftables-${PKG_VER}/py && \
    python3 setup.py install --prefix=/usr"
