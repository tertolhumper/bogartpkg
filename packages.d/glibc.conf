PKG_NAME="glibc"
PKG_VER="2.44"
PKG_URL1="https://ftp.gnu.org/gnu/glibc/glibc-${PKG_VER}.tar.xz"
PKG_URL2=""
PKG_URL3=""
PKG_BUILD_TYPE="custom"
PKG_PRE_BUILD="patch -Np1 -i /sources/glibc-${PKG_VER}-fhs-1.patch 2>/dev/null || true && mkdir -p build && echo 'rootsbindir=/usr/sbin' > build/configparms && useradd -m tester 2>/dev/null || true"
PKG_CUSTOM_BUILD="cd build && ../configure --prefix=/usr --disable-werror --enable-kernel=4.19 --enable-stack-protector=strong --disable-nscd libc_cv_slibdir=/usr/lib && make -j$(nproc)"
PKG_CUSTOM_INSTALL="cd build && touch /etc/ld.so.conf && chown -R tester . && su tester -c 'make check -j$(nproc)' 2>&1 | tee /var/log/glibc-check.log || true && make install && sed '/RTLDLIST=/s@/usr@@g' -i /usr/bin/ldd && mkdir -pv /usr/lib/locale && localedef -i C -f UTF-8 C.UTF-8"
