PKG_NAME="wireplumber"
PKG_VER="0.5.19"
PKG_URL1="https://gitlab.freedesktop.org/pipewire/wireplumber/-/archive/${PKG_VER}/wireplumber-${PKG_VER}.tar.gz"
PKG_URL2=""
PKG_URL3=""
PKG_BUILD_TYPE="meson"
PKG_PRE_BUILD="mkdir -p /var/tmp/bogartpkg/wireplumber-${PKG_VER}/subprojects/packagecache && \
    curl -L 'https://www.lua.org/ftp/lua-5.5.0.tar.gz' \
        -o /var/tmp/bogartpkg/wireplumber-${PKG_VER}/subprojects/packagecache/lua-5.5.0.tar.gz && \
    curl -L 'https://github.com/mesonbuild/wrapdb/releases/download/lua_5.5.0-1/lua_5.5.0-1_patch.zip' \
        -o /var/tmp/bogartpkg/wireplumber-${PKG_VER}/subprojects/packagecache/lua_5.5.0-1_patch.zip"
PKG_MESON_OPTS="-Dlibdir=/usr/lib \
  -Dtests=false"
